name: verify

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Restore .NET dependencies
        run: dotnet restore YunKao.sln

      - name: Run .NET tests
        run: dotnet test YunKao.sln --no-restore

      - name: Build WinUI app
        run: dotnet build src\YunKao.App\YunKao.App.csproj --no-restore -c Release -p:Platform=x64

      - name: Run bridge tests
        run: node --test tests\bridge.test.js

      - name: Check bridge syntax
        run: node --check src\YunKao.App\Scripts\yunkao-bridge.js
